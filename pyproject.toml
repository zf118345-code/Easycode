[tool.poetry]
name = "easycode"
version = "2.4.0"
description = "Easycode 节点自动化引擎"
authors = ["Easycode Team"]
readme = "README.md"
packages = [{ include = "core" }, { include = "api" }]

[tool.poetry.dependencies]
python = "^3.10"
fastapi = ">=0.100.0"
uvicorn = ">=0.22.0"
pydantic = ">=2.0.0"
pyautogui = ">=0.9.54"
opencv-python = ">=4.8.0"
numpy = ">=1.24.0"
Pillow = ">=10.0.0"
pywin32 = { version = ">=306", markers = "sys_platform == 'win32'" }
uiautomation = ">=2.0.20"
dxcam = ">=0.0.5"
rapidocr-onnxruntime = ">=1.3.0"
ddddocr = ">=1.4.7"
cryptography = ">=41.0.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=7.0"
pytest-asyncio = ">=0.21"
httpx = ">=0.24"
ruff = ">=0.6.0"
bandit = ">=1.7.0"

[tool.poetry.scripts]
easycode = "api.app:main"

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes (unused imports, variables, etc.)
    "I",   # isort (import sorting)
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function call in argument defaults (FastAPI pattern)
    "SIM108", # use ternary instead of if-else (readability)
]

[tool.ruff.lint.isort]
known-first-party = ["core", "api"]

[tool.ruff.format]
quote-style = "single"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
