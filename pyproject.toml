[tool.poetry]
name = "easycode"
version = "2.4.0"
description = "Easycode 节点自动化引擎"
authors = ["Easycode Team"]
readme = "README.md"
packages = [{ include = "core" }, { include = "api" }]

[tool.poetry.dependencies]
python = "^3.10"
fastapi = ">=0.100.0"
uvicorn = ">=0.22.0"
pydantic = ">=2.0.0"
pyautogui = ">=0.9.54"
opencv-python = ">=4.8.0"
numpy = ">=1.24.0"
Pillow = ">=10.0.0"
pywin32 = { version = ">=306", markers = "sys_platform == 'win32'" }
cryptography = ">=41.0.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=7.0"
pytest-asyncio = ">=0.21"
httpx = ">=0.24"

[tool.poetry.scripts]
easycode = "api.app:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
