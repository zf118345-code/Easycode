name: CI

on:
  push:
    branches: [ main, canvas-flow ]
  pull_request:
    branches: [ main, canvas-flow ]

jobs:
  frontend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
        with:
          version: 8
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install
      - name: Lint frontend
        run: pnpm run lint:check
      - run: pnpm run test
      - run: pnpm run build

  backend-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Poetry
        run: pip install poetry
      - name: Install dependencies
        run: poetry install
      - name: Check backend correctness lint
        run: poetry run ruff check api core --select E9,F,B --ignore B008
      - name: Scan medium and high severity security issues
        run: poetry run bandit -q -r api core -ll
      - name: Run tests
        run: poetry run pytest tests/ -v
