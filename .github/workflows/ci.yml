name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint frontend
        run: npm run lint:check
      - name: Typecheck frontend
        run: npm run typecheck
      - run: npm test
      - run: npm run build

  backend-tests:
    runs-on: windows-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Poetry
        run: pip install poetry
      - name: Verify dependency lock
        run: poetry check --lock
      - name: Install dependencies
        run: poetry sync --no-interaction
      - name: Check backend correctness lint
        run: poetry run ruff check api core --select E9,F,B --ignore B008
      - name: Check vNext API contract drift
        run: poetry run python scripts/generate_vnext_contracts.py --check
      - name: Scan medium and high severity security issues
        run: poetry run bandit -q -r api core -ll
      - name: Run tests
        run: poetry run pytest tests/ -v
